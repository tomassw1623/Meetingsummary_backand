spring:
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: gemma:2b
          # --- [추가된 부분 시작] ---
          # 텍스트를 벡터로 변환(임베딩)할 때 사용할 모델 설정
          embedding:
            options:
              model: mxbai-embed-large # 경량 임베딩 모델
          # --- [추가된 부분 끝] ---

      # 벡터 데이터베이스 저장소에 대한 설정
      vector:
        store:
          pgvector:
            # 새로 만든 vector_db 데이터베이스에 연결합니다.
            jdbc-url: jdbc:postgresql://localhost:5432/vector_db
            username: postgres
            password: root1234
            table-name: vector_store
            embedding-dimension: 1024
            index-type: HNSW
            distance-type: COSINE

  datasource:
    url: jdbc:postgresql://localhost:5432/meetingsummarydb
    username: postgres
    password: root1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 226468575665-itc6f7ss7rri6b2bobrv17eqvj9siot0.apps.googleusercontent.com
            client-secret: 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
            scope:
              - profile
              - email
          naver:
            client-id: 1wzrm3svh0oM8heW49NH
            client-secret: t0vVM89RtR
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - name
              - email
            client-name: Naver
          kakao:
            client-id:
            client-secret:
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
            client-name: Kakao

        # 'provider' 블록은 'registration'과 같은 레벨이어야 합니다.
        provider: # 👈 위치 수정됨
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# 'jwt' 블록은 'spring' 블록 바깥, 맨 앞 레벨에 위치해야 합니다.
jwt: # 👈 위치 수정됨
  secret: "${JWT_SECRET}"
  access-token-validity-in-seconds: 86400 # 1일
